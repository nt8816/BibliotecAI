<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor - Livros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Área do Gestor</h1>
        <nav>
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="livros.html" class="active">Livros</a></li>
                <li><a href="alunos.html">Alunos</a></li>
                <li><a href="sair.html">Sair</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="livros-container">
            <h2>Gerenciar Livros</h2>
            <button class="btn" id="btn-add-livro">Adicionar Novo Livro</button>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Area do conhecimento</th>
                            <th>ID</th>
                            <th>Tombo</th>
                            <th>Autor</th>
                            <th>Título</th>
                            <th>Vol</th>
                            <th>Edição</th>
                            <th>Local</th>
                            <th>Editora</th>
                            <th>Ano</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="livros-list">
                        <!-- Lista de livros será populada pelo JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal para adicionar/editar livro -->
    <div id="modal-livro" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 id="modal-title">Adicionar Livro</h3>
            <form id="form-livro">
                <input type="hidden" id="livro-id">

                <div class="form-row">
                    <div class="form-group">
                        <label for="tombo">Tombo:</label>
                        <input type="number" id="tombo" required>
                    </div>
                    <div class="form-group">
                        <label for="vol">Volume (Vol):</label>
                        <input type="text" id="vol">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="ano">Ano:</label>
                        <input type="number" id="ano" required>
                    </div>
                    <div class="form-group">
                        <label for="edicao">Edição:</label>
                        <input type="text" id="edicao">
                    </div>
                </div>

                <label for="area do conhecimento">Area do conhecimento:</label>
                <input type="text" id="area" required>

                <label for="autor">Autor:</label>
                <input type="text" id="autor" required>
                
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" required>

                <label for="local">Local:</label>
                <input type="text" id="local">

                <label for="editora">Editora:</label>
                <input type="text" id="editora" required>
                
                <button type="submit" class="save-btn">Salvar</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
